volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  production_django_static: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: tesys_tagboard_production_django
    container_name: tesys_tagboard_production_django
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: 5
    volumes:
      - production_django_media:/app/tesys_tagboard/media
      - production_django_static:/app/staticfiles
    depends_on:
      - postgres
      - redis
    env_file:
      - path: ./.envs/.production/.postgres
        required: false
      - path: ./.envs/.production/.django
        required: false
      - path: ./.env
        required: false
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: tesys_tagboard_production_postgres
    container_name: tesys_tagboard_production_postgres
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: 5
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.production/.postgres
        required: false
      - path: ./.env
        required: false

  redis:
    image: docker.io/redis:8.8
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: 3

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: tesys_tagboard_production_nginx
    depends_on:
      - django
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: 5
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
      - production_django_static:/usr/share/nginx/static:ro
    ports:
      - '0.0.0.0:11611:80'
